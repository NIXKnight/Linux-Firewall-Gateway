name: Build NFS kernel image

on:
  push:
    branches:
      - main
    paths:
      - docker/nfs-kernel/**
      - .github/workflows/nfs-kernel-container-image-build.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check entrypoint shell
        run: shellcheck docker/nfs-kernel/entrypoint.sh

      - name: Check protocol boundary
        run: |
          grep -Fq 'vers2 = no' docker/nfs-kernel/nfs.conf
          grep -Fq 'vers3 = no' docker/nfs-kernel/nfs.conf
          grep -Fq 'vers4.0 = no' docker/nfs-kernel/nfs.conf
          grep -Fq 'vers4.1 = yes' docker/nfs-kernel/nfs.conf
          grep -Fq 'vers4.2 = yes' docker/nfs-kernel/nfs.conf
          grep -Fq 'tcp = yes' docker/nfs-kernel/nfs.conf
          grep -Fq 'udp = no' docker/nfs-kernel/nfs.conf
          grep -Fq 'rpc.mountd -F --no-netlink' docker/nfs-kernel/entrypoint.sh
          grep -Fq -- '--no-netlink' docker/nfs-kernel/entrypoint.sh
          grep -Fq -- '-N 2' docker/nfs-kernel/entrypoint.sh
          grep -Fq -- '-N 3' docker/nfs-kernel/entrypoint.sh
          grep -Fq -- '-u' docker/nfs-kernel/entrypoint.sh
          grep -Fq 'test "$(cat "${THREADS_FILE}")" -gt 0' docker/nfs-kernel/entrypoint.sh
          grep -Fq 'pgrep -x rpc.mountd' docker/nfs-kernel/entrypoint.sh
          grep -Fq 'pgrep -x nfsdcld' docker/nfs-kernel/entrypoint.sh
          grep -Fq 'exportfs -s' docker/nfs-kernel/entrypoint.sh
          ! grep -Fq 'no_mount_listener' docker/nfs-kernel/entrypoint.sh
          ! grep -Eq 'rpcbind|rpc\.statd' docker/nfs-kernel/entrypoint.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: docker/nfs-kernel
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/nfs-kernel:2.9.2-${{ github.sha }}
            ${{ secrets.DOCKER_HUB_USERNAME }}/nfs-kernel:2.9.2
            ${{ secrets.DOCKER_HUB_USERNAME }}/nfs-kernel:latest
          provenance: true
          sbom: true
